<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <h1>Adblock Rust</h1>
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="stats">
      <span id="blocked-count">0</span>
      <span class="label">ads blocked on this page</span>
    </div>
    <div class="status" id="status">Initializing...</div>
    <div class="actions">
      <button id="btn-picker">Block Element</button>
      <button id="btn-whitelist">Whitelist this site</button>
      <button id="btn-options">Options</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
