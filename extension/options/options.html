<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Adblock Rust - Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Adblock Rust Options</h1>

    <section>
      <h2>Filter Lists</h2>
      <div id="filter-lists"></div>
      <div class="add-list">
        <input type="text" id="custom-list-url" placeholder="Enter custom filter list URL">
        <button id="btn-add-list">Add</button>
      </div>
      <button id="btn-update-lists" class="primary">Update all lists now</button>
    </section>

    <section>
      <h2>Custom Rules</h2>
      <textarea id="custom-rules" rows="8" placeholder="Enter custom filter rules, one per line&#10;Example: ||ads.example.com^"></textarea>
      <button id="btn-save-rules" class="primary">Save rules</button>
    </section>

    <section>
      <h2>Whitelisted Domains</h2>
      <div id="whitelist"></div>
    </section>

    <section>
      <h2>Import / Export</h2>
      <div class="import-export">
        <button id="btn-export">Export settings</button>
        <button id="btn-import">Import settings</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>
    </section>

    <div id="status-message" class="status-message"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
